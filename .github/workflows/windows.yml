name: Windows build and tests
on:
  push:
    branches: [main, 'codex/**']
    paths: ['Windows/**', 'scripts/build-windows.ps1', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', 'scripts/build-windows.ps1', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, self-test, smoke-test and publish
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Publish
      - uses: actions/upload-artifact@v4
        with:
          name: NoticeSender-Windows-x64
          path: dist/NoticeSender-3.1.2-preview.1-Windows-x64.zip
          if-no-files-found: error
